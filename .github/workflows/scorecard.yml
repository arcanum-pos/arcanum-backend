# OpenSSF Scorecard: an independent score of this repo's security practices
# (branch protection, pinned dependencies, token permissions, CI checks, …).
# Results under Security → Code scanning, and published at
# https://scorecard.dev/viewer/?uri=github.com/<this repo>.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 6 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
